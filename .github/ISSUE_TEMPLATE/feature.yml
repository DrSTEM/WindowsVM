name: Feature request
description: Suggest an improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
      description: Include alternatives or relevant platform constraints if known.
